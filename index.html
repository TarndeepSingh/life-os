<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS</title>
<script>try{var p=JSON.parse(localStorage.getItem("lifeos.prefs")||"{}");if(p.theme&&p.theme!=="system")document.documentElement.setAttribute("data-theme",p.theme)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F0;--bg2:#EFEEE6;--sf:#fff;--tx:#292E29;--mu:#6E7068;--bd:#E8E6DD;--sg:#8FA995;--pr:#405B49;--onp:#fff;--tc:#C98972;--lv:#B8ADD5;--yl:#E9D69A;--sh:0 1px 2px rgba(41,46,41,.05),0 14px 28px -18px rgba(41,46,41,.25);--se:"Fraunces",Georgia,serif;--mo:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#202720;--bg2:#293229;--sf:#303B32;--tx:#F2F0E8;--mu:#A9B2A5;--bd:#414C42;--sg:#A3BDA4;--pr:#A3BDA4;--onp:#202720;--tc:#D49A81;--lv:#C2B5E2;--yl:#D9C98A;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202720;--bg2:#293229;--sf:#303B32;--tx:#F2F0E8;--mu:#A9B2A5;--bd:#414C42;--sg:#A3BDA4;--pr:#A3BDA4;--onp:#202720;--tc:#D49A81;--lv:#C2B5E2;--yl:#D9C98A;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:24px 24px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--bd);padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font:600 27px var(--se);letter-spacing:-.02em;padding:0 10px 30px}.brand em{color:var(--tc)}
.nv{display:flex;gap:12px;align-items:baseline;width:100%;background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;color:var(--mu);transition:.15s}
.nv i{font:400 11px var(--mo);font-style:normal}.nv:hover{color:var(--tx);background:var(--bd)}.nv.on{color:var(--tx);background:var(--sf);box-shadow:var(--sh);font-weight:600}
.sb{margin-top:auto;padding:10px}.sb b{font:500 30px var(--mo);display:block}.sb span{color:var(--mu);font-size:13px}
main{padding:48px 56px 90px;max-width:1180px;width:100%}
main>*{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
h1{font:400 44px/1.08 var(--se);letter-spacing:-.02em;margin:6px 0 8px}h1 em{color:var(--pr)}
h3{font:600 12px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 14px}
.mo{font-family:var(--mo)}.mu{color:var(--mu)}.q{color:var(--mu);font:italic 400 18px var(--se);max-width:46ch;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:36px}
.dg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px 44px}.col{display:flex;flex-direction:column;gap:38px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:26px}
.hero{display:flex;gap:30px;align-items:center}
.ring{flex:none;width:150px;height:150px;position:relative}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}.ring .t{stroke:var(--bd)}.ring .f{stroke:var(--pr);stroke-dasharray:402;animation:rg 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rg{from{stroke-dashoffset:402}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 34px var(--se)}
.st{display:grid;gap:8px;flex:1}.st div{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:7px}.st b{font:500 14px var(--mo)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.add input[type=text]{flex:1;min-width:150px}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--pr);outline:0}
.btn{background:var(--pr);color:var(--onp);border:0;border-radius:12px;padding:9px 18px;font-weight:600;transition:.15s}.btn:hover{transform:translateY(-1px);opacity:.92}.btn.s{background:none;color:var(--tx);border:1px solid var(--bd)}
.lk{background:none;border:0;color:var(--mu);padding:4px 8px;border-radius:8px;font-size:13px}.lk:hover{color:var(--tx);background:var(--bg2)}
.tr{display:flex;align-items:center;gap:14px;padding:12px 8px;margin:0 -8px;border-radius:12px;transition:.15s}.tr:hover{background:var(--bg2)}.g{flex:1;min-width:0}
.cb{width:22px;height:22px;border:1.5px solid var(--mu);border-radius:50%;background:none;padding:0;flex:none;position:relative;transition:.2s}.cb:hover{border-color:var(--pr)}
.cb.on{background:var(--pr);border-color:var(--pr);animation:pop .3s}.cb.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--onp);border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes pop{50%{transform:scale(1.25)}}
.dn .tt{text-decoration:line-through;color:var(--mu)}.od{color:var(--tc)}
.chip{font:500 11px var(--mo);padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c,var(--bd)) 30%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--bd)) 60%,transparent);white-space:nowrap}
.wk{display:flex;gap:10px;height:150px;align-items:flex-end}.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bs{width:100%;max-width:34px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}.bs span{display:block;height:var(--h);min-height:0;border-radius:6px;transform-origin:bottom;animation:gr .7s both}@keyframes gr{from{transform:scaleY(0)}}
.bc b{font:500 11px var(--mo)}.bc em{font-style:normal;font-size:11px;color:var(--mu)}
textarea{width:100%;min-height:120px;resize:vertical;font-family:var(--se);font-size:16px;line-height:1.6;background:var(--sf)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 8px}.tabs button{background:none;border:0;padding:6px 12px;border-radius:20px;color:var(--mu)}.tabs button.on{background:var(--pr);color:var(--onp)}
.hm{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px;margin:14px 0 10px;overflow-x:auto;padding-bottom:2px}
.hm i{border-radius:4px;background:var(--bd);cursor:pointer;transition:.12s}.hm i.on{background:var(--sg)}.hm i.e{background:none;cursor:default}.hm i:not(.e):hover{outline:1.5px solid var(--tx);outline-offset:1px}
.hb{padding:22px 0;border-bottom:1px solid var(--bd)}.hn{font:400 22px var(--se)}
.emp{padding:26px;border:1.5px dashed var(--bd);border-radius:18px;color:var(--mu);text-align:center}.emp b{display:block;font:400 20px var(--se);color:var(--tx);margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden}.seg button{background:none;border:0;padding:8px 16px}.seg button.on{background:var(--pr);color:var(--onp)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#ov[hidden]{display:none}#ov{position:fixed;inset:0;background:rgba(20,26,20,.55);display:grid;place-items:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}#ov .card{max-width:460px;width:100%;animation:up .35s both}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:14px}#toast.show{opacity:1;transform:translate(-50%,0)}
.si{width:76px;padding:7px 8px}input[type=checkbox]{width:auto;padding:0}svg text{font:11px var(--mo);fill:var(--mu)}rect[data-a]{cursor:pointer;transition:.12s}rect[data-a]:hover,rect[data-a]:focus{fill:var(--pr)}
@media(max-width:820px){
.app{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;z-index:9;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd)}
.brand,.sb{display:none}.nv{flex-direction:column;align-items:center;gap:0;text-align:center;font-size:12px;padding:7px 2px}.nv i{display:none}
main{padding:26px 18px 100px}h1{font-size:34px}.dg{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.top{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="study.css">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#405B49"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
</head><body>
<div class="app"><aside id="nav"></aside><main id="app"></main></div><div id="ov" hidden></div><div id="toast" role="status"></div>
<script src="study-core.js"></script>
<script src="study.js"></script>
<script src="sync-core.js"></script>
<script src="cloud.js"></script>
<script>
const $=s=>document.querySelector(s);
const K={p:"lifeos.prefs",t:"lifeos.tasks",h:"lifeos.habits",n:"lifeos.notes",x:"lifeos.ex",w:"lifeos.ws"};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Storage is blocked in this browser")}try{CLOUD.touch()}catch(e){}};
let P=ld(K.p,{name:"",theme:"system",done:false}),T=ld(K.t,[]),H=ld(K.h,[]),N=ld(K.n,{});
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>{const e=$("#"+id);return e?e.value.trim():""};
function seedEx(){return [["Push-ups","reps"],["Squats","reps"],["Pull-ups","reps"],["Plank","time"],["Toe touches","time"],["Running","dist"]].map(e=>({id:uid(),name:e[0],kind:e[1],wt:false,arch:false}))}
let X=ld(K.x,null),W=ld(K.w,[]);if(!X){X=seedEx();sv(K.x,X)}
let view="day",f="today",q="",fx=null,tt,OBH="",OBS="";
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
function applyTheme(){const r=document.documentElement;P.theme==="system"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",P.theme)}
const PR={urgent:[0,"Urgent","--tc"],high:[1,"High","--yl"],medium:[2,"Medium","--lv"],low:[3,"Low","--sg"]};
const CATS=["Health","Learning","Spirituality","Productivity","Personal Development","Fitness","Other"];
const QUOTES=["Small steps, consistently taken, create extraordinary results.","Begin where you are. Use what you have.","Progress, not perfection.","A calm mind finishes more than a rushed one.","What you do daily matters more than what you do occasionally.","Show up today. Tomorrow will thank you."];
const chip=p=>`<span class="chip" style="--c:var(${PR[p][2]})">${PR[p][1]}</span>`;
const cmp=(a,b)=>a.done-b.done||PR[a.pr][0]-PR[b.pr][0]||(a.due||"9").localeCompare(b.due||"9")||(a.time||"99").localeCompare(b.time||"99");
const tScope=()=>T.filter(t=>t.due===today()||t.doneAt===today()||(t.due&&t.due<today()&&!t.done));
const live=()=>H.filter(h=>!h.arch);
const act=d=>H.filter(h=>h.log[d]).length+T.filter(t=>t.doneAt===d).length+SS.activity(d);
function gstreak(){let i=act(today())?0:1,n=0;while(i<3650&&act(ago(i))){n++;i++}return n}
function streak(h){let i=h.log[today()]?0:1,n=0;while(i<3650&&h.log[ago(i)]){n++;i++}return n}
function best(h){let b=0,c=0,p=null;Object.keys(h.log).sort().forEach(k=>{c=p&&(new Date(k)-new Date(p))/864e5===1?c+1:1;b=Math.max(b,c);p=k});return b}
function rate(h){const s=Math.min(30,Math.floor((new Date(today())-new Date(h.created))/864e5)+1);let c=0;for(let i=0;i<s;i++)if(h.log[ago(i)])c++;return Math.round(c/s*100)}
function prog(){const ts=tScope(),hs=live(),td=ts.filter(t=>t.done).length,hd=hs.filter(h=>h.log[today()]).length,tot=ts.length+hs.length;return{ts,td,hs,hd,tot,p:tot?(td+hd)/tot:0}}
function fmtDue(t){const d=t.due?(t.due===today()?"Today":t.due===ago(-1)?"Tomorrow":new Date(t.due+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})):"No date";return d+(t.time?" at "+t.time:"")}
const row=t=>`<div class="tr ${t.done?"dn":""}"><button class="cb ${t.done?"on":""}" role="checkbox" aria-checked="${!!t.done}" aria-label="Complete: ${esc(t.t)}" data-a="tt" data-i="${t.id}"></button><div class="g"><div class="tt">${esc(t.t)}</div><div class="mo mu ${!t.done&&t.due&&t.due<today()?"od":""}" style="font-size:12px">${fmtDue(t)}</div></div>${SS.taskChips(t)}${chip(t.pr)}<button class="lk" aria-label="Delete task" data-a="dt" data-i="${t.id}">Delete</button></div>`;
const opts=a=>a.map(o=>`<option>${o}</option>`).join("");
const prOpts=sel=>Object.keys(PR).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${PR[k][1]}</option>`).join("");
function hcheck(h){return `<div class="tr"><button class="cb ${h.log[today()]?"on":""}" role="checkbox" aria-checked="${!!h.log[today()]}" aria-label="Log ${esc(h.name)}" data-a="hc" data-i="${h.id}" data-d="${today()}"></button><div class="g">${esc(h.name)}</div><span class="mo mu" style="font-size:12px">${streak(h)} day streak</span></div>`}
function vDay(){const g=prog(),hr=new Date().getHours(),pc=Math.round(g.p*100),L=402*(1-g.p),
list=g.ts.slice().sort(cmp).slice(0,8),wk=[6,5,4,3,2,1,0].map(n=>{const d=ago(n);return{d,h:H.filter(x=>x.log[d]).length,t:T.filter(x=>x.doneAt===d).length}}),mx=Math.max(1,...wk.map(x=>x.h+x.t));
return `<div class="top"><div><div class="mo mu" style="font-size:12px">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase()}</div><h1>${hr<12?"Good morning":hr<18?"Good afternoon":"Good evening"}${P.name?", <em>"+esc(P.name)+"</em>":""}.</h1><p class="q">${QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length]}</p></div><button class="btn s" data-a="th">Theme: ${P.theme[0].toUpperCase()+P.theme.slice(1)}</button></div>
${live_ws()?`<div class="emp" style="margin-bottom:20px;text-align:left;padding:14px 18px">Workout in progress: ${esc(live_ws().name)}. <button class="lk" data-a="v" data-i="move" style="text-decoration:underline">Resume</button></div>`:""}
${(T.length+H.length)&&(!P.lastBackup||(new Date(today())-new Date(P.lastBackup))/864e5>=7)?'<div class="emp" style="margin-bottom:28px;text-align:left;padding:14px 18px">Your data is stored only in this browser. <button class="lk" data-a="exp" style="text-decoration:underline">Download a backup</button></div>':""}
<div class="dg"><div class="col">
<div class="card hero"><div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle class="t" cx="75" cy="75" r="64"/><circle class="f" cx="75" cy="75" r="64" style="stroke-dashoffset:${L}"/></svg><b>${pc}%</b></div><div class="st"><div><span>Tasks</span><b>${g.td}/${g.ts.length}</b></div><div><span>Habits</span><b>${g.hd}/${g.hs.length}</b></div><div><span>Streak</span><b>${gstreak()} days</b></div><div><span>Productivity score</span><b>${pc}</b></div></div></div>
<section><h3>Today’s priorities</h3><div class="add"><input type="text" id="q1" data-e="atd" placeholder="Add a priority for today" aria-label="New task"><select id="p1" aria-label="Priority">${prOpts("medium")}</select><button class="btn" data-a="atd">Add</button></div>${list.map(row).join("")||'<div class="emp"><b>A clear day.</b>Add the one thing that matters most today.</div>'}</section>
${SS.dayLeft()}</div><div class="col">
${SS.dayRight()}<section><h3>Habit snapshot</h3>${live().slice(0,6).map(hcheck).join("")||'<div class="emp"><b>No habits yet.</b><button class="btn" data-a="v" data-i="habits" style="margin-top:10px">Create a habit</button></div>'}</section>
<section><h3>Last 7 days</h3><div class="wk">${wk.map(x=>`<div class="bc" title="${x.d}: ${x.h} habits, ${x.t} tasks"><b>${x.h+x.t}</b><div class="bs"><span style="--h:${x.t/mx*100}%;background:var(--tc)"></span><span style="--h:${x.h/mx*100}%;background:var(--sg)"></span></div><em>${new Date(x.d+"T00:00").toLocaleDateString(undefined,{weekday:"short"})}</em></div>`).join("")}</div><p class="mu" style="font-size:12.5px;margin:10px 0 0">Habits logged (green) and tasks completed (terracotta).</p></section>
<section><h3>Personal notes <span id="sv" class="mo" style="text-transform:none;letter-spacing:0"></span></h3><textarea id="note" aria-label="Today’s note" placeholder="What’s on your mind today?">${esc(N[today()]||"")}</textarea></section>
</div></div>`}
function listHTML(){let a=T.filter(t=>f==="today"?t.due===today()&&!t.done:f==="upcoming"?t.due>today()&&!t.done:f==="overdue"?t.due&&t.due<today()&&!t.done:f==="done"?t.done:!t.done);if(q)a=a.filter(t=>t.t.toLowerCase().includes(q.toLowerCase()));
a.sort(f==="done"?(x,y)=>(y.doneAt||"").localeCompare(x.doneAt||""):cmp);return a.map(row).join("")||`<div class="emp"><b>Nothing here.</b>${f==="done"?"Completed tasks will appear here.":"You’re clear in this view."}</div>`}
function vTasks(){const c=k=>T.filter(t=>k==="today"?t.due===today()&&!t.done:k==="upcoming"?t.due>today()&&!t.done:k==="overdue"?t.due&&t.due<today()&&!t.done:k==="done"?t.done:!t.done).length;
return `<div class="top"><div><h1>My tasks</h1><p class="q">Press N anywhere to add one.</p></div></div><div class="add"><input type="text" id="tn" data-e="att" placeholder="What needs doing?" aria-label="Task title"><select id="tp" aria-label="Priority">${prOpts("medium")}</select><input type="date" id="td" value="${today()}" aria-label="Due date"><input type="time" id="tm" aria-label="Due time"><button class="btn" data-a="att">Add task</button></div>
<div class="tabs">${[["today","Today"],["upcoming","Upcoming"],["overdue","Overdue"],["all","All"],["done","Completed"]].map(x=>`<button class="${f===x[0]?"on":""}" data-a="f" data-i="${x[0]}">${x[1]} <span class="mo" style="font-size:11px">${c(x[0])}</span></button>`).join("")}</div><input type="search" id="sq" placeholder="Search tasks" value="${esc(q)}" aria-label="Search tasks" style="width:100%;max-width:320px;margin-bottom:10px"><div id="tl">${listHTML()}</div>`}
function heat(h){const pad=new Date(ago(83)+"T00:00").getDay();let c='<i class="e"></i>'.repeat(pad);for(let i=83;i>=0;i--){const d=ago(i);c+=`<i class="${h.log[d]?"on":""}" title="${d}" data-a="hc" data-i="${h.id}" data-d="${d}"></i>`}return `<div class="hm" aria-label="Last 12 weeks">${c}</div>`}

function addEx(s,id){if(!s||!id)return;if(s.exs.some(x=>x.exId===id))return toast("Already in this workout");const ls=lastSets(id,s.id);s.exs.push({id:uid(),exId:id,skipped:false,sets:ls.length?ls.map(t=>mkSet({reps:t.reps,sec:t.sec,m:t.m,g:t.g})):[mkSet()]})}
function finish(s){stopT(s);const dn=s.exs.reduce((a,e)=>a+(e.skipped?0:e.sets.filter(okSet).length),0);if(!dn&&!confirm("No completed sets. Save this workout anyway?"))return;
const prs=[];s.exs.forEach(e=>{const x=exOf(e.exId),k=KV[x.kind],cur=e.sets.filter(t=>okSet(t)&&t[k]!=null).map(t=>t[k]);if(e.skipped||!cur.length)return;const old=W.filter(w=>w.status==="done"&&w.id!==s.id).flatMap(w=>w.exs.filter(y=>y.exId===e.exId&&!y.skipped).flatMap(y=>y.sets.filter(t=>okSet(t)&&t[k]!=null).map(t=>t[k])));if(old.length&&Math.max(...cur)>Math.max(...old))prs.push(x.name)});
s.exs.forEach(e=>{const k=KV[exOf(e.exId).kind];e.sets=e.sets.filter(t=>t.done||t.skip||t[k]!=null)});
if(!s.reopened)s.end=new Date().toISOString();delete s.reopened;s.status="done";s.timer=null;saveW();render();toast(prs.length?"New personal best: "+prs.join(", "):"Workout saved")}
function csv(){const r=[["date","workout","exercise","set","reps","seconds","meters","grams","completed","skipped","status"]];W.forEach(s=>s.exs.forEach(e=>e.sets.forEach((t,i)=>r.push([s.date,s.name,exOf(e.exId).name,i+1,t.reps==null?"":t.reps,t.sec==null?"":t.sec,t.m==null?"":t.m,t.g==null?"":t.g,!!t.done,!!(t.skip||e.skipped),s.status]))));const q=v=>'"'+String(v).replace(/"/g,'""')+'"',l=document.createElement("a");l.href=URL.createObjectURL(new Blob([r.map(x=>x.map(q).join(",")).join("\n")],{type:"text/csv"}));l.download="lifeos-workouts-"+today()+".csv";l.click()}
function xgo(a,i,d){const s=live_ws(),ex=s&&s.exs.find(x=>x.id===i),st=s&&s.exs.flatMap(x=>x.sets).find(t=>t.id===i);
if(a==="x_pt"){const r=$("#ro");if(r)r.textContent=i+": "+d;return}
if(a==="x_csv"){csv();return}
if(a==="x_ar"){const e=X.find(x=>x.id===i);if(e){e.arch=!e.arch;saveX();render()}return}
if(a==="x_st"){if(s)return toast("Finish your current workout first");W.push({id:uid(),name:val("wn0")||"Workout",date:today(),start:new Date().toISOString(),end:null,status:"active",exs:[],notes:"",timer:null})}
else if(a==="x_rp"){if(s)return toast("Finish your current workout first");const o=W.find(w=>w.id===i);if(o)W.push({id:uid(),name:o.name,date:today(),start:new Date().toISOString(),end:null,status:"active",notes:"",timer:null,exs:o.exs.map(e=>({id:uid(),exId:e.exId,skipped:false,sets:e.sets.filter(t=>!t.skip).map(t=>mkSet({reps:t.reps,sec:t.sec,m:t.m,g:t.g}))}))})}
else if(a==="x_ed"){if(s)return toast("Finish your current workout first");const o=W.find(w=>w.id===i);if(o){o.status="active";o.reopened=true;o.timer=null}}
else if(a==="x_de"){if(confirm("Delete this workout permanently?"))W=W.filter(w=>w.id!==i)}
else if(!s)return;
else if(a==="x_ae")addEx(s,val("xs"));
else if(a==="x_ne"){const n=val("xn");if(!n)return toast("Enter an exercise name");let e=X.find(x=>!x.arch&&x.name.toLowerCase()===n.toLowerCase());if(!e){e={id:uid(),name:n.slice(0,40),kind:val("xk"),wt:$("#xw").checked,arch:false};X.push(e);saveX()}addEx(s,e.id)}
else if(a==="x_rx"){if(confirm("Remove this exercise and its sets from the workout?")){if(s.timer&&ex&&ex.sets.some(t=>t.id===s.timer.sid))s.timer=null;s.exs=s.exs.filter(x=>x.id!==i)}}
else if(a==="x_up"||a==="x_dn"){const k=s.exs.indexOf(ex),j=a==="x_up"?k-1:k+1;if(j>=0&&j<s.exs.length)[s.exs[k],s.exs[j]]=[s.exs[j],s.exs[k]]}
else if(a==="x_sk"){ex.skipped=!ex.skipped;if(ex.skipped&&s.timer&&ex.sets.some(t=>t.id===s.timer.sid))s.timer=null}
else if(a==="x_as")ex.sets.push(mkSet());
else if(a==="x_cs"){const l=ex.sets[ex.sets.length-1];ex.sets.push(mkSet(l?{reps:l.reps,sec:l.sec,m:l.m,g:l.g}:null))}
else if(a==="x_rs"){if(running(s,i))s.timer=null;s.exs.forEach(x=>x.sets=x.sets.filter(t=>t.id!==i))}
else if(a==="x_ss"){st.skip=!st.skip;if(st.skip){st.done=false;if(running(s,i))s.timer=null}}
else if(a==="x_ok"){if(st.done)st.done=false;else{const o=s.exs.find(q=>q.sets.includes(st)),v=st[KV[exOf(o.exId).kind]];if(running(s,i))return toast("Stop the timer first");if(v==null)return toast("Enter a value before marking the set complete");st.done=true;st.skip=false}}
else if(a==="x_tm"){if(running(s,i))stopT(s);else{stopT(s);s.timer={sid:i,at:Date.now(),base:st.sec||0};st.done=false}}
else if(a==="x_fin")return finish(s);
else if(a==="x_dis"){if(confirm("Discard this workout and everything logged in it?"))W=W.filter(w=>w!==s)}
saveW();render()}
function fieldChange(s,el){const st=s.exs.flatMap(x=>x.sets).find(q=>q.id===el.dataset.sid);if(!st)return;const f=el.dataset.f,raw=el.value.trim();let bad="";
if(f==="reps"){if(raw==="")st.reps=null;else{const n=+raw;if(Number.isInteger(n)&&n>=1&&n<=5000)st.reps=n;else bad="Reps must be a whole number from 1 to 5000"}}
else if(f==="min"||f==="sec"){const r=document.querySelector(`[data-sid="${st.id}"][data-f="min"]`),c=document.querySelector(`[data-sid="${st.id}"][data-f="sec"]`);if(r.value===""&&c.value==="")st.sec=null;else{const a=r.value===""?0:+r.value,b=c.value===""?0:+c.value,t=a*60+b;if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||b>59||t<1||t>86400)bad="Enter a valid time: seconds 0 to 59, at least 1 second";else st.sec=t}}
else if(f==="km"){if(raw==="")st.m=null;else{const v=+raw;if(v>0&&v<=1000)st.m=Math.round(v*1000);else bad="Distance must be above 0 and up to 1000 km"}}
else if(f==="kg"){if(raw==="")st.g=null;else{const v=+raw;if(v>=0&&v<=1000)st.g=Math.round(v*1000);else bad="Weight must be 0 to 1000 kg"}}
const o=s.exs.find(q=>q.sets.includes(st));if(st.done&&st[KV[exOf(o.exId).kind]]==null){st.done=false;bad=bad||"This set is no longer marked complete because its value is empty"}
saveW();if(bad){toast(bad);render()}}
document.addEventListener("change",e=>{const t=e.target,s=live_ws();
if(t.id==="wn"&&s){s.name=t.value.trim().slice(0,60)||"Workout";saveW()}
else if(t.dataset&&t.dataset.sid&&s)fieldChange(s,t);
else if(t.dataset&&t.dataset.xid){const x=X.find(q=>q.id===t.dataset.xid),n=t.value.trim().slice(0,40);if(x&&n&&!X.some(q=>q!==x&&!q.arch&&q.name.toLowerCase()===n.toLowerCase()))x.name=n;else toast("Name is empty or already used");saveX();render()}
else if(t.id==="ax"){ax=t.value;am="total";render()}else if(t.id==="am"){am=t.value;render()}else if(t.id==="ar"){ar=+t.value;render()}});
document.addEventListener("input",e=>{const s=live_ws();if(e.target.id==="wnote"&&s){s.notes=e.target.value;saveW()}});
setInterval(()=>{const s=live_ws();if(!s||view!=="move")return;const el=$("#el");if(el&&!s.reopened)el.textContent=fmtT((Date.now()-new Date(s.start))/1000);if(s.timer){const l=document.querySelector(`[data-live="${s.timer.sid}"]`);if(l)l.textContent=fmtT(elapsedT(s))}},500);
if(live_ws()&&live_ws().timer)setTimeout(()=>toast("A timer was running when the page closed. Check that duration."),600);

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
applyTheme();render();CLOUD.init();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
